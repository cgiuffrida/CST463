# Submit this file with your final student_code.py. The evaluator supplies the
# pinned full dataset, 90 epochs, private evaluation split, and hidden seeds.
model:
  channels: [32, 64, 128]
  num_classes: 100
  dropout: 0.0
  optimizer_name: adamw
  learning_rate: 0.0003
  weight_decay: 0.0001

# This controls the evaluator's training-loader batch size. It may be reduced
# by the evaluator if needed to fit the fixed hardware safely.
batch_size: 64
